# workspace-hack is generated by cargo hakari, whose formatting taplo would rewrite.
exclude = [".direnv", "target", "workspace-hack/Cargo.toml"]
include = ["**/*.toml", "*.toml"]

[formatting]
# 90 keeps workspace dependency tables single-line: usage-derive's workspace
# inheritance lookup breaks on multi-line inline tables that precede `usage`.
column_width = 90
reorder_arrays = true
reorder_keys = true
