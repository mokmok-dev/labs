[workspace]
members = [
  "echonet-lite",
  "echonet-lite-codegen",
  "echonet-lite-udp",
  "echonet-radar",
  "echonet-radar-cli",
  "echonet-radar-core",
  "workspace-hack",
]
resolver = "3"

[workspace.dependencies]
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4", features = ["derive"] }
echonet-lite = { version = "0.0.0", path = "./echonet-lite" }
echonet-lite-codegen = { version = "0.0.0", path = "./echonet-lite-codegen" }
echonet-lite-udp = { version = "0.0.0", path = "./echonet-lite-udp" }
echonet-radar = { version = "0.0.0", path = "./echonet-radar" }
echonet-radar-cli = { version = "0.0.0", path = "./echonet-radar-cli" }
echonet-radar-core = { version = "0.0.0", path = "./echonet-radar-core" }
gpui-kit = "0.6"
gpui-wry = "0.6"
rust-embed = "8"
# gpui-wry builds its webviews with the lb-wry fork; use the same package so
# builder types match when echonet-radar constructs its own webview.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "sync",
  "time",
] }
workspace-hack = { version = "0.0.0", path = "./workspace-hack" }
wry = { package = "lb-wry", version = "0.53.3" }

[workspace.lints.clippy]
all = "deny"
expect_used = "deny"
nursery = "deny"
panic = "deny"
pedantic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[workspace.lints.rust]
future_incompatible = "deny"
unsafe_code = "deny"
unused = "deny"

[workspace.metadata.crane]
name = "labs"

[workspace.package]
edition = "2024"
version = "0.0.0"
