[workspace]
members = [
  "echonet-lite",
  "echonet-lite-codegen",
  "echonet-lite-udp",
  "echonet-radar",
  "workspace-hack",
]
resolver = "3"

[workspace.dependencies]
echonet-lite = { version = "0.0.0", path = "./echonet-lite" }
echonet-lite-codegen = { version = "0.0.0", path = "./echonet-lite-codegen" }
echonet-lite-udp = { version = "0.0.0", path = "./echonet-lite-udp" }
echonet-radar = { version = "0.0.0", path = "./echonet-radar" }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
# Keep dependency tables single-line: usage-derive's workspace-inheritance lookup
# cannot resolve `usage` when a preceding entry is a multi-line inline table.
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
usage = { package = "usage-rs", version = "6" }
workspace-hack = { version = "0.0.0", path = "./workspace-hack" }

[workspace.lints.clippy]
all = "deny"
expect_used = "deny"
nursery = "deny"
panic = "deny"
pedantic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[workspace.lints.rust]
future_incompatible = "deny"
unsafe_code = "deny"
unused = "deny"

[workspace.metadata.crane]
name = "labs"

[workspace.package]
edition = "2024"
version = "0.0.0"
