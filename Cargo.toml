[workspace]
members = [
  "echonet-lite",
  "echonet-lite-codegen",
  "echonet-lite-udp",
  "echonet-radar-cli",
  "echonet-radar-core",
]
resolver = "3"

[workspace.dependencies]
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4", features = ["derive"] }
echonet-lite = { version = "0.0.0", path = "./echonet-lite" }
echonet-lite-codegen = { version = "0.0.0", path = "./echonet-lite-codegen" }
echonet-lite-udp = { version = "0.0.0", path = "./echonet-lite-udp" }
echonet-radar-cli = { version = "0.0.0", path = "./echonet-radar-cli" }
echonet-radar-core = { version = "0.0.0", path = "./echonet-radar-core" }
ratatui = { version = "0.30", default-features = false, features = [
  "crossterm",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "sync",
  "time",
] }

[workspace.lints.clippy]
all = "deny"
expect_used = "deny"
nursery = "deny"
panic = "deny"
pedantic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[workspace.lints.rust]
future_incompatible = "deny"
unsafe_code = "deny"
unused = "deny"

[workspace.metadata.crane]
name = "labs"

[workspace.package]
edition = "2024"
version = "0.0.0"
